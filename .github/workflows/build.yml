name: Build and Deploy Page

on:
  push:
    branches:
      - main
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Upload Pages Artifact
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Upload Downloadable Build
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: dist/
          retention-days: 30

  deploy:
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Update GitHub Release with Web App URL
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          EXISTING_BODY=$(gh release view "$TAG_NAME" --json body -q .body 2>/dev/null || echo "")
          if ! echo "$EXISTING_BODY" | grep -q "$PAGE_URL"; then
            NEW_NOTES=$(printf "%s\n\n---\n### 🌐 Webサイト (時間割アプリ)\n👉 **[時間割アプリを開く](%s)**" "$EXISTING_BODY" "$PAGE_URL")
            gh release edit "$TAG_NAME" --notes "$NEW_NOTES"
          fi

  deploy-to-parent:
    name: Deploy to 1bunkaiyu314.github.io/tools/timetableApps
    if: github.ref == 'refs/heads/main' || github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check DEPLOY_PAT Secret
        id: check_token
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$DEPLOY_PAT" ]; then
            echo "has_token=false" >> $GITHUB_OUTPUT
            echo "::warning ::'DEPLOY_PAT' secret is not set. Skipping automatic deployment to 1bunkaiyu314.github.io. Please configure DEPLOY_PAT in repository secrets."
          else
            echo "has_token=true" >> $GITHUB_OUTPUT
          fi

      - name: Download Build Artifact
        if: steps.check_token.outputs.has_token == 'true'
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: dist

      - name: Deploy to 1bunkaiyu314/1bunkaiyu314.github.io
        if: steps.check_token.outputs.has_token == 'true'
        env:
          DEPLOY_PAT: ${{ secrets.DEPLOY_PAT }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # ターゲットリポジトリ (1bunkaiyu314.github.io) をクローン
          git clone --depth 1 "https://x-access-token:${DEPLOY_PAT}@github.com/1bunkaiyu314/1bunkaiyu314.github.io.git" parent_repo
          cd parent_repo

          # tools/timetableApps ディレクトリを作成して成果物を配置
          mkdir -p tools/timetableApps
          rm -rf tools/timetableApps/*
          cp -r ../dist/* tools/timetableApps/

          # 変更がある場合のみコミットしてプッシュ
          git add tools/timetableApps
          if git diff --staged --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy timetableApps from ${{ github.repository }}@${{ github.sha }}"
            git push origin HEAD
            echo "Successfully deployed to 1bunkaiyu314.github.io/tools/timetableApps"
          fi
