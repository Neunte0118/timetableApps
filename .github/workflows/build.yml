name: Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: 
      contents: write
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload build result
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: Latest Build
          body: |
            最新のコミットによる自動ビルド成果物です。
            コミットID: ${{ github.sha }}
          prerelease: true
          files: dist/*
